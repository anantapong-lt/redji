version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Falls back to a dev-only default if no root .env sets POSTGRES_PASSWORD
      # (docker-compose reads ${VAR} substitution from a root .env, not from
      # apps/api/.env). Without this fallback, a fresh volume + no root .env
      # silently creates a database with a blank password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: novelnova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: